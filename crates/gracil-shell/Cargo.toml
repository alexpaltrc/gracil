[package]
name = "gracil-shell"
description = "File Explorer's Gracil menu. Runs inside explorer.exe, so it only forwards (ADR 0006)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "gracil_shell"
# The DLL Explorer loads, and a library for the tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
gracil-core.workspace = true
gracil-windows.workspace = true
windows.workspace = true
windows-core.workspace = true

[dev-dependencies]
# The `menu` example reads the right-click menu the way File Explorer builds it.
windows = { workspace = true, features = ["Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
