[package]
name = "gracil-ui"
description = "The Gracil desktop application."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "gracil"
path = "src/main.rs"

[build-dependencies]
embed-resource.workspace = true

[dependencies]
gracil-core.workspace = true
gracil-windows.workspace = true
iced.workspace = true
log.workspace = true
rfd.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
# Not used in code: it picks the parts of Iced's WGPU that are built in (ADR 0066).
wgpu.workspace = true

[dev-dependencies]
gracil-core = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
