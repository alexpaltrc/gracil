[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# Single source of truth for the Gracil version. See docs/development/versioning.md.
version = "1.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "GPL-3.0-or-later"
repository = "https://github.com/alexpaltrc/gracil"
authors = ["Alex Palacios"]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

# A development build draws as smoothly as a release: everything Gracil is built on is optimized,
# and only Gracil's own code, which changes, is built the quick way (ADR 0075).
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

# A release's speed under a development build's name, to time the real app beside the Gracil in
# daily use (ADR 0075): `cargo run --profile timing -p gracil-ui`. Quicker to build than a release.
[profile.timing]
inherits = "release"
debug-assertions = true
lto = "thin"
codegen-units = 16

[workspace.dependencies]
exoquant = "0.2.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "tiff", "bmp"] }
oxipng = { version = "9.1.5", default-features = false, features = ["parallel"] }
pulp = { version = "0.22.3", default-features = false, features = ["std", "x86-v3"] }
rayon = "1.12.0"
rgb = "0.8.53"
ssimulacra2 = "0.5.1"
yuvxyb = "0.4.2"
gracil-core = { path = "crates/gracil-core" }
gracil-windows = { path = "crates/gracil-windows" }
embed-resource = "3.0.11"
iced = { version = "0.14.0", default-features = false, features = ["wgpu-bare", "tiny-skia", "thread-pool", "canvas", "advanced"] }
# Only for its features: the window draws with Direct3D 12 alone, so Vulkan, OpenGL and the rest
# of WGPU's ways to draw are left out of Gracil (ADR 0066). Kept in step with Iced's own WGPU.
wgpu = { version = "=27.0.1", default-features = false, features = ["dx12", "wgsl", "std", "parking_lot"] }
log = "0.4.34"
rfd = { version = "0.17.2", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "ansi"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Shell"] }
windows-sys = { version = "0.61.2", features = ["Wdk_Graphics_Direct3D", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Performance", "Win32_System_Pipes", "Win32_System_Power", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
