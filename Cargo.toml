[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# Single source of truth for the Gracil version. See docs/development/versioning.md.
version = "1.0.0-dev"
edition = "2024"
rust-version = "1.98"
publish = false
license = "GPL-3.0-or-later"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

[workspace.dependencies]
exoquant = "0.2.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "tiff", "bmp"] }
oxipng = { version = "9.1.5", default-features = false, features = ["parallel"] }
rgb = "0.8.53"
ssimulacra2 = "0.5.1"
gracil-core = { path = "crates/gracil-core" }
gracil-windows = { path = "crates/gracil-windows" }
embed-resource = "3.0.11"
iced = { version = "0.14.0", default-features = false, features = ["wgpu", "tiny-skia", "thread-pool", "canvas", "advanced"] }
log = "0.4.34"
rfd = { version = "0.17.2", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "ansi"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Shell"] }
windows-sys = { version = "0.61.2", features = ["Wdk_Graphics_Direct3D", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Performance", "Win32_System_Pipes", "Win32_System_Power", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
