[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# Single source of truth for the Gracil version. See docs/development/versioning.md.
version = "0.0.1-dev"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
