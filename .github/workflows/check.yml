# Every push and pull request must pass the same checks as a local commit: scripts/check.ps1
# (formatting, Clippy with warnings as errors, and tests). The tests that need FFmpeg skip
# themselves here, since the runner has none.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check
        shell: pwsh
        run: ./scripts/check.ps1
